<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Student | ProjectLoop</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">Project<span>Loop</span></a>

    <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="sell.html">Sell</a>
        <a href="chat.html">Messages</a>
        <a href="profile.html">Profile</a>
    </nav>
</header>


<main class="verification-page">

    <div class="verification-card">

        <div class="verification-icon">🎓</div>

        <h1>Welcome to ProjectLoop</h1>

        <p>
            Verify your student identity to access your campus marketplace.
        </p>

        <form id="verificationForm">

            <label>College Email</label>

            <input
                type="email"
                placeholder="Enter your college email"
                required
            >


            <label>Student ID</label>

            <input
                type="text"
                placeholder="Enter student ID"
                required
            >


            <button type="submit" class="primary-btn">
                Verify & Continue
            </button>

        </form>


        <div class="secure-note">
            🔒 Only verified students can access ProjectLoop.
        </div>

    </div>

</main>


<script src="js/script.js"></script>

</body>
</html>
